# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  checkstyle_job:
    runs-on: ubuntu-latest
    name: Checkstyle job
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run check style
        uses: nikitasavinov/checkstyle-action@master
        with:
          github_token: ${{ secrets.TESTTOOL_TOKEN }}
          reporter: 'github-pr-check'
          tool_name: 'testtool'

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: carlease
          MYSQL_ROOT_PASSWORD: CHANGE_ME_DB_PASSWORD
        ports:
          - 3306:3306
          # Before continuing, verify the mysql container is reachable from the ubuntu host
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libmysqlclient-dev libgirepository1.0-dev
      - name: Checkout the repository
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build with Maven and run tests
        run: mvn -Pproduction --batch-mode --update-snapshots verify
      - name: Copy docker-compose
        run: cp docker-compose.yml ./target
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./target/


  deploy:
    runs-on: ubuntu-latest
    needs: [build, ]
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app/
      - name: Copy host via scp
        uses: appleboy/scp-action@master
        with:
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          PORT: 22
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app/*"
          target: "/home/${{ secrets.SSH_USER }}/"
          strip_components: 1
          rm: false
          overwrite: true

      # see https://github.com/appleboy/scp-action/issues/52
      - name: Executing remote command
        uses: appleboy/ssh-action@master
        with:
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          PORT: 22
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/
            mkdir ./letsencrypt/acme.json
            touch ./letsencrypt/acme.json
            sudo chmod 0600 ./letsencrypt/acme.json
            sudo docker-compose down --remove-orphans
            sudo echo "PUB_IP=${{ secrets.SSH_HOST }}" | sed -e 's/\./-/g' > .env
            sudo echo "PWD=/home/${{ secrets.SSH_USER }}/" >> .env
            sudo docker-compose up -d
