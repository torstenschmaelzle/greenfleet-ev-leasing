# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  checkstyle_job:
    runs-on: ubuntu-latest
    name: Checkstyle job
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Run check style
        uses: nikitasavinov/checkstyle-action@master
        with:
          github_token: ${{ secrets.TESTTOOL_TOKEN }}
          reporter: 'github-pr-check'
          tool_name: 'testtool'

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: carlease
          MYSQL_ROOT_PASSWORD: CHANGE_ME_DB_PASSWORD
        ports:
          - 3306:3306
          # Before continuing, verify the mysql container is reachable from the ubuntu host
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libmysqlclient-dev libgirepository1.0-dev
      - name: Checkout the repository
        uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Build with Maven and run tests
        run: mvn -Pproduction --batch-mode --update-snapshots verify
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build React frontend
        env:
          VITE_UNSPLASH_KEY: ${{ secrets.VITE_UNSPLASH_KEY }}
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Copy docker-compose
        run: cp docker-compose.yml ./target
      - name: Copy frontend build to target
        run: cp -r frontend/dist ./target/frontend-dist
      - name: Copy nginx config
        run: cp nginx.conf ./target/nginx.conf
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./target/


  deploy:
    runs-on: ubuntu-latest
    needs: [build, ]
    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          name: app
          path: app/
      - name: Copy host via scp
        uses: appleboy/scp-action@master
        with:
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          PORT: 22
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app/*"
          target: "/home/${{ secrets.SSH_USER }}/"
          strip_components: 1
          rm: false
          overwrite: true

      # see https://github.com/appleboy/scp-action/issues/52
      - name: Executing remote command
        uses: appleboy/ssh-action@master
        with:
          HOST: ${{ secrets.SSH_HOST }}
          USERNAME: ${{ secrets.SSH_USER }}
          PORT: 22
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/
            mkdir -p ./letsencrypt
            touch ./letsencrypt/acme.json
            sudo chmod 0600 ./letsencrypt/acme.json
            sudo docker compose down --remove-orphans
            sudo echo "PUB_IP=${{ secrets.SSH_HOST }}" | sed -e 's/\./-/g' > .env
            sudo echo "PWD=/home/${{ secrets.SSH_USER }}/" >> .env
            sudo docker compose up -d
            echo "--- Waiting for containers to start ---"
            sleep 15
            echo "--- Container status ---"
            sudo docker compose ps
            echo "--- Spring Boot logs (app) ---"
            sudo docker compose logs app --tail=80
            echo "--- Nginx logs (frontend) ---"
            sudo docker compose logs frontend --tail=20
            echo "--- Testing login endpoint from within Docker network ---"
            sudo docker compose exec -T frontend curl -s -o /dev/null -w "HTTP status: %{http_code}\n" -X POST http://app:8080/api/auth/login -H "Content-Type: application/json" -d '{"username":"worker","password":"12345"}' || echo "curl failed - app not reachable from frontend container"
